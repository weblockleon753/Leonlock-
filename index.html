<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lua Locker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="app">
    <header><h1>🔐 Lua Locker</h1><p>Lock • Store • Raw</p><div class="brand">Web by <strong>Leon</strong> · <a href="https://www.tiktok.com/@leondz3011" target="_blank" rel="noopener">TikTok @leondz3011</a></div></header>

    <section id="auth" class="card">
      <h2>Đăng nhập</h2>
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Mật khẩu">
      <div class="row">
        <button id="login">Đăng nhập</button>
        <button id="signup" class="secondary">Đăng ký</button>
      </div>
      <button id="google" class="google">Đăng nhập bằng Google</button>
      <p id="authMsg" class="msg"></p>
    </section>

    <section id="panel" class="card hidden">
      <div class="top"><div><b id="userEmail"></b></div><button id="logout" class="secondary">Đăng xuất</button></div>
      <h2>Tạo Lua Locker</h2>
      <input id="name" placeholder="Tên script">
      <textarea id="code" placeholder="Dán code Lua vào đây..."></textarea>
      <input id="file" type="file" accept=".lua,.txt">
      <button id="lock">🔒 Khóa & tạo Raw Link</button>
      <p id="status" class="msg"></p>
      <div id="result" class="result hidden">
        <b>Raw Link</b>
        <input id="rawUrl" readonly>
        <button id="copy">Copy Raw Link</button>
        <pre id="loader"></pre>
      </div>
    </section>
  <footer>© Lua Locker · Web by <strong>Leon</strong> · <a href="https://www.tiktok.com/@leondz3011" target="_blank" rel="noopener">TikTok: @leondz3011</a></footer>
</main>
  <script src="app.js"></script>
</body>
</html>
