<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lua Locker V3</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><header class="top"><div><div class="brand">🔐 Lua Locker</div><div class="sub">Lock • Store • Raw</div></div><button id="logout" class="ghost hidden">Đăng xuất</button></header><section id="login" class="card"><h2>👤 Đăng nhập</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mật khẩu"><button id="loginBtn" class="primary full">Đăng nhập</button><button id="signupBtn" class="secondary full">Tạo tài khoản</button><button id="googleBtn" class="google full">🌐 Đăng nhập Google</button><div id="authMsg" class="msg"></div></section><section id="app" class="card hidden"><div class="userbar"><b id="user"></b><button id="configBtn" class="ghost">⚙️ Cấu hình</button></div><h2>🔒 Khóa Lua</h2><input id="name" placeholder="Tên script"><input id="slug" placeholder="Tên Raw"><input id="file" type="file" accept=".lua,.txt"><textarea id="code" rows="15" placeholder="Dán code Lua vào đây..."></textarea><button id="lock" class="primary full">🔒 Khóa & tạo Raw</button><div id="lockMsg" class="msg"></div><div id="result" class="result hidden"><label>Raw URL</label><input id="raw" readonly><button id="copyRaw" class="secondary full">📋 Sao chép Raw</button><label>Loader</label><pre id="loader"></pre><button id="copyLoader" class="secondary full">📋 Sao chép Loader</button></div></section><section id="settings" class="card hidden"><h2>⚙️ Cấu hình một lần</h2><p class="muted">Dùng Project URL và Publishable key. Không dán Secret/Service Role Key.</p><label>Supabase Project URL</label><input id="url" placeholder="https://xxxxxxxx.supabase.co"><label>Supabase Publishable Key</label><textarea id="key" rows="3" placeholder="sb_publishable_..."></textarea><button id="save" class="primary full">Lưu & kết nối</button><button id="back" class="ghost full">Quay lại</button><div id="setupMsg" class="msg"></div></section><footer>Web by Leon · <a href="https://www.tiktok.com/@leondz3011" target="_blank">@leondz3011</a></footer></main><script src="config.js"></script><script src="app.js"></script></body></html>
