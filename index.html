<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lua Locker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <div class="brand">🔐 Lua Locker</div>
        <div class="sub">Lock • Store • Raw</div>
      </div>
      <button id="logoutBtn" class="ghost hidden">Đăng xuất</button>
    </header>

    <section id="setupCard" class="card">
      <h2>⚙️ Kết nối lần đầu</h2>
      <p class="muted">Dán <b>Project URL</b> và <b>Publishable key</b> của Supabase. Thông tin này chỉ lưu trong trình duyệt của bạn.</p>
      <label>Supabase Project URL</label>
      <input id="supabaseUrl" placeholder="https://xxxxxxxx.supabase.co" autocomplete="off">
      <label>Supabase Publishable Key</label>
      <textarea id="supabaseKey" rows="3" placeholder="sb_publishable_... hoặc anon key" autocomplete="off"></textarea>
      <div class="row">
        <button id="saveConfigBtn" class="primary">Lưu & kết nối</button>
        <button id="clearConfigBtn" class="ghost">Xóa cấu hình</button>
      </div>
      <div id="setupMsg" class="msg"></div>
    </section>

    <section id="authCard" class="card hidden">
      <h2>👤 Tài khoản</h2>
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Mật khẩu (ít nhất 6 ký tự)">
      <div class="row">
        <button id="loginBtn" class="primary">Đăng nhập</button>
        <button id="signupBtn" class="secondary">Tạo tài khoản</button>
      </div>
      <button id="googleBtn" class="google">🌐 Đăng nhập bằng Google</button>
      <div id="authMsg" class="msg"></div>
    </section>

    <section id="appCard" class="card hidden">
      <div class="userbar">
        <div>
          <div class="muted small">Đang đăng nhập</div>
          <b id="userEmail"></b>
        </div>
        <button id="changeConfigBtn" class="ghost">⚙️ Cấu hình</button>
      </div>

      <h2>🔒 Khóa Lua</h2>
      <input id="scriptName" placeholder="Tên script">
      <input id="slug" placeholder="Tên Raw, ví dụ: my-script">
      <input id="fileInput" type="file" accept=".lua,.txt">
      <textarea id="code" rows="14" placeholder="Dán code Lua vào đây..."></textarea>
      <button id="lockBtn" class="primary full">🔒 Khóa & tạo Raw</button>
      <div id="lockMsg" class="msg"></div>

      <div id="result" class="result hidden">
        <div class="muted small">Raw URL</div>
        <input id="rawUrl" readonly>
        <button id="copyRawBtn" class="secondary full">📋 Sao chép Raw URL</button>
        <div class="muted small">Loader dùng trong executor</div>
        <pre id="loader"></pre>
        <button id="copyLoaderBtn" class="secondary full">📋 Sao chép Loader</button>
      </div>
    </section>

    <footer>Web by Leon · <a href="https://www.tiktok.com/@leondz3011" target="_blank" rel="noopener">@leondz3011</a></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
